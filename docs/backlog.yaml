schema_version: '1.0'
product: aws-cost-cleaner
milestones:
- id: M1
  title: 検証の土台と純粋モジュール
  goal: uv run aws-cost-cleaner --help が動き、CI で ruff・mypy --strict・pytest が回る。boto3
    に依存しない例外・型・タグ・許可表・設定がそろい、Stage 0 の確認記録と Cost Explorer CSV の見本がリポジトリにある
- id: M2
  title: scan が動く
  goal: API の許可リストを通したクライアントで、6 種類のリソースを発見・収集・判定・料金計算し、aws-cost-cleaner scan が scan
    結果の JSON と要約を出す(moto 上で確かめられる)
- id: M3
  title: report が動く
  goal: aws-cost-cleaner report が scan 結果と任意の Cost Explorer CSV から、Markdown のレポートと承認
    JSON を AWS を呼ばずに出す
- id: M4
  title: 承認にもとづくタグ付け・停止・削除
  goal: 承認 JSON を使って tag / stop / delete が dry-run と --apply で動き、Keep の保護、2 段階の削除、待ち期間、AWS
    のエラーの扱いが受け入れテストで確かめられる
- id: M5
  title: IAM・ドキュメント・料金表の保守
  goal: infra/iam-roles.yaml が cfn-lint と静的テストを通り、事前準備・エージェント用プロンプト・README がそろい、同梱の料金表を作り直すスクリプトがある
tasks:
- id: T-001
  title: プロジェクトの土台(pyproject、CI、CLI の骨組み、clock)
  milestone: M1
  request: '詳細設計 F-1 と「構成」の表にもとづき、uv の src レイアウトのプロジェクトを作る。pyproject.toml: name は
    aws-cost-cleaner、requires-python は >=3.12、依存は boto3。dev 依存は pytest、moto[ec2,rds,elbv2,cloudwatch,sts]、ruff、mypy、boto3-stubs[ec2,rds,elbv2,cloudwatch,resource-explorer-2,pricing,sts]、cfn-lint、pyyaml、types-PyYAML。[project.scripts]
    に aws-cost-cleaner = aws_cost_cleaner.cli:main。uv.lock も入れる。.gitignore に out/
    と .cache/ を書く。src/aws_cost_cleaner/__init__.py と __main__.py を作る。cli.py には main(argv:
    Sequence[str] | None = None) -> int を置き、argparse でサブコマンド scan、report、tag、stop、delete
    を登録する(中身は後のタスクで作る。今は「未実装」と標準エラーに出して 2 を返す)。clock.py: Protocol Clock(now() -> datetime。UTC
    の aware な値)、SystemClock、FixedClock(dt)。ruff の banned-api(TID251)で boto3.client、boto3.Session、datetime.datetime.now、datetime.datetime.utcnow
    を禁止し、per-file-ignores で src/aws_cost_cleaner/aws/session.py と src/aws_cost_cleaner/clock.py
    だけを除く。.github/workflows/ci.yml で uv run ruff check、uv run ruff format --check、uv
    run mypy --strict src tests、uv run pytest を走らせる(cfn-lint は T-032 で足す)。'
  acceptance:
  - uv run aws-cost-cleaner --help が終了コード 0 で、出力に scan、report、tag、stop、delete が含まれる
  - uv run python -m aws_cost_cleaner --help も終了コード 0 で、同じ 5 つのサブコマンドを表示する
  - uv run ruff check、uv run ruff format --check、uv run mypy --strict src tests、uv
    run pytest がすべて終了コード 0 で終わる
  - FixedClock(dt).now() は dt を返し、SystemClock().now() の utcoffset() は 0 である
  - pyproject.toml の ruff の banned-api に boto3.client、boto3.Session、datetime.datetime.now、datetime.datetime.utcnow
    の 4 つがある
  - .gitignore に out/ と .cache/ の行がある
  depends_on: []
  size: M
  human_check: ''
  status: todo
- id: T-002
  title: 例外の階層と終了コード(errors.py)
  milestone: M1
  request: '詳細設計 F-2 の例外の階層を src/aws_cost_cleaner/errors.py に作る。クラス名は AwsCostCleanerError、ConfigError、CostCsvError、ApprovalFileError、AccountMismatchError(ApprovalFileError
    の子)、DisallowedApiCallError、ProtectedResourceError、NotCandidateError、StateMismatchError、WaitPeriodNotElapsedError、AwsOperationError。AwsOperationError
    は __init__(self, message: str, aws_error_code: str | None) で、属性 aws_error_code
    を持つ。同じファイルに定数 EXIT_OK = 0、EXIT_PARTIAL_FAILURE = 1、EXIT_USAGE = 2 を置く。cli.py に
    run_with_error_handling(fn: Callable[[], int]) -> int を足す。fn が ConfigError、CostCsvError、ApprovalFileError(子を含む)を出したら、標準エラーにメッセージを
    1 行出して 2 を返す。それ以外は fn の戻り値をそのまま返す。'
  acceptance:
  - ConfigError から AwsOperationError までの 10 クラスは、すべて AwsCostCleanerError の子である
  - AccountMismatchError は ApprovalFileError の子である
  - AwsOperationError('x', 'SomeCode').aws_error_code == 'SomeCode'
  - EXIT_OK、EXIT_PARTIAL_FAILURE、EXIT_USAGE がそれぞれ 0、1、2 である
  - run_with_error_handling は、ConfigError・CostCsvError・ApprovalFileError・AccountMismatchError
    を出す関数について 2 を返し、標準エラーに 1 行出す
  - 'run_with_error_handling(lambda: 1) は 1 を返す'
  depends_on:
  - T-001
  size: S
  human_check: ''
  status: todo
- id: T-003
  title: データの型(models.py)
  milestone: M1
  request: '詳細設計 データ 5・6・9 と F-5 にもとづき、src/aws_cost_cleaner/models.py に型を置く(boto3
    に依存しない)。ResourceType = Literal[''ebs_volume'',''elastic_ip'',''nat_gateway'',''load_balancer'',''ec2_instance'',''rds_instance'']、Action
    = Literal[''Stop'',''Delete'']、SkipReason はデータ 5 の skip_reason の表の 11 個の Literal。frozen
    dataclass: Resource(resource_type, region, resource_id, arn: str | None, name:
    str | None, tags: Mapping[str, str], state: str, created_at: datetime | None,
    attrs: Mapping[str, Any])、Finding(データ 5 の findings の要素と同名のフィールド)、Skipped(resource_type,
    region, resource_id, skip_reason)、DiscoveryInfo(method, warnings: tuple[str, ...])、ScanResult(データ
    5 の最上位のキーと同名。discovery は DiscoveryInfo)、ApprovalItem(データ 6 の items の要素と同名)、Outcome(データ
    9 のとおり)。Finding、Skipped、ScanResult、ApprovalItem は to_dict() -> dict[str, Any]
    と classmethod from_dict を持ち、to_dict のキーはデータ 5・6 の JSON と同じにする。'
  acceptance:
  - データ 5 の例と同じ形の dict d について、ScanResult.from_dict(d).to_dict() == d
  - データ 6 の items の例と同じ形の dict e について、ApprovalItem.from_dict(e).to_dict() == e
  - Finding.to_dict() のキーの集合は、データ 5 の findings の要素のキーの集合と一致する
  - estimated_monthly_usd が None の Finding を json.dumps すると null になる
  - Resource と Outcome の属性に代入すると dataclasses.FrozenInstanceError になる
  depends_on:
  - T-002
  size: M
  human_check: ''
  status: todo
- id: T-004
  title: Outcome の表示と終了コード
  milestone: M1
  request: 'src/aws_cost_cleaner/models.py に render_outcomes(outcomes: Sequence[Outcome])
    -> str と exit_code_for_outcomes(outcomes: Sequence[Outcome]) -> int を足す(詳細設計 データ
    9)。render_outcomes は 1 項目を 1 行で出す。各行は status、action、resource_type、region、resource_id、error
    の例外クラス名、aws_error_code、note をタブでつなぎ、値がない欄は - にする。最後の行は planned=<n> done=<n> skipped=<n>
    failed=<n> にする。exit_code_for_outcomes は failed が 1 件でもあれば 1、なければ 0 を返す。'
  acceptance:
  - Outcome 2 件を渡すと、出力は 3 行になる
  - error が StateMismatchError の行には、タブ区切りの 6 番目の欄に StateMismatchError と出る
  - error、aws_error_code、note が None の欄は - になる
  - 最後の行は planned=<n> done=<n> skipped=<n> failed=<n> の形で、件数が正しい
  - failed が 1 件あれば exit_code_for_outcomes は 1、空のリストや failed がないときは 0 を返す
  depends_on:
  - T-003
  size: S
  human_check: ''
  status: todo
- id: T-005
  title: タグの定数と判定(tags.py)
  milestone: M1
  request: '詳細設計 データ 1 にもとづき、src/aws_cost_cleaner/tags.py を作る(boto3 に依存しない)。定数は KEEP
    = ''Keep''、CLEANUP_CANDIDATE = ''CleanupCandidate''、CLEANUP_REASON = ''CleanupReason''、CLEANUP_STOPPED_AT
    = ''CleanupStoppedAt''。関数は is_protected(tags: Mapping[str, str]) -> bool(Keep
    の値を strip().lower() して ''true'' と比べる)、is_candidate(tags) -> bool(CleanupCandidate
    の値が ''true'' と完全に一致するときだけ True)、parse_stopped_at(value: str | None) -> datetime
    | None(datetime.fromisoformat で読む。タイムゾーンがない値、読めない値、None は None)、format_stopped_at(dt:
    datetime) -> str(UTC に直して %Y-%m-%dT%H:%M:%SZ)。'
  acceptance:
  - is_protected は Keep が 'true'、'True'、' TRUE ' で True、'false' やキーがないときは False
  - is_candidate は 'true' で True、'True' や 'TRUE' やキーがないときは False
  - parse_stopped_at('2026-10-08T03:00:00Z') は 2026-10-08 03:00:00 UTC の aware な datetime
    を返す
  - parse_stopped_at は '2026-10-08T03:00:00'(タイムゾーンなし)、'abc'、None について None を返す
  - format_stopped_at(datetime(2026,10,15,12,0,0, tzinfo=+09:00)) は '2026-10-15T03:00:00Z'
    を返す
  depends_on:
  - T-001
  size: S
  human_check: ''
  status: todo
- id: T-006
  title: 種類 × アクション × 理由コードの許可表(catalog.py)
  milestone: M1
  request: '詳細設計 データ 2 にもとづき、src/aws_cost_cleaner/catalog.py を作る(boto3 に依存しない)。ALLOWED:
    frozenset[tuple[ResourceType, Action, str]] にデータ 2 の 8 行を持つ。is_allowed(resource_type,
    action, reason_code) -> bool。RESOURCE_TYPES は ebs_volume、elastic_ip、nat_gateway、load_balancer、ec2_instance、rds_instance
    の順のタプル。service_label(resource_type, lb_type: str | None = None) -> str は「目的と範囲」の表の表示名(EC2
    (EBS)、VPC (EIP)、VPC (NAT)、EC2、RDS)を返す。load_balancer では lb_type が ''application''
    なら ''ELB (ALB)''、''network'' なら ''ELB (NLB)'' を返し、それ以外は ValueError を出す。'
  acceptance:
  - ALLOWED はちょうど 8 要素で、データ 2 の表と一致する
  - is_allowed('ec2_instance', 'Delete', 'ec2-low-cpu') は False、is_allowed('ec2_instance',
    'Delete', 'ec2-stopped-elapsed') は True
  - RESOURCE_TYPES は request に書いた順の 6 要素のタプルである
  - service_label('load_balancer', 'application') == 'ELB (ALB)'、service_label('load_balancer',
    'network') == 'ELB (NLB)'
  - service_label('ebs_volume') == 'EC2 (EBS)'、service_label('elastic_ip') == 'VPC
    (EIP)'
  depends_on:
  - T-003
  size: S
  human_check: ''
  status: todo
- id: T-007
  title: 設定の読み込み(config.py)と設定ファイルの例
  milestone: M1
  request: '詳細設計 データ 3 にもとづき、src/aws_cost_cleaner/config.py を作る。frozen dataclass:
    ScanConfig(resource_explorer_region: str, regions: tuple[str, ...], max_metric_requests:
    int)、Thresholds(period_days: int, ec2_cpu_max_percent: float, ec2_network_bytes_max:
    int, rds_connections_max: int, nat_bytes_max: int, stop_wait_days: int)、PricingConfig(use_price_list_api:
    bool, cache_ttl_hours: int)、Config(scan, thresholds, pricing)。Thresholds.stop_wait_days
    は TOML の [actions] から読む。load_config(path: Path | None, overrides: Mapping[str,
    object] | None = None) -> Config。overrides のキーは節名なしの TOML のキー名(period_days、regions
    など)で、値が None のものは無視する。標準値はデータ 3 の例のとおり(use_price_list_api は true)。範囲(period_days
    >= 1、stop_wait_days >= 1、ec2_cpu_max_percent は 0–100、max_metric_requests >= 0、ec2_network_bytes_max
    >= -1)、型の違い、未知の節やキーは ConfigError にする。リポジトリ直下に aws-cost-cleaner.example.toml をデータ
    3 の内容(コメントつき)で作る。'
  acceptance:
  - load_config(None) は データ 3 の標準値(period_days=7、ec2_cpu_max_percent=5.0、ec2_network_bytes_max=-1、rds_connections_max=0、nat_bytes_max=0、stop_wait_days=7、max_metric_requests=1000、use_price_list_api=True、cache_ttl_hours=24)を返す
  - TOML に書いた値が標準値を上書きし、overrides の値が TOML の値を上書きする
  - period_days=0、stop_wait_days=0、ec2_cpu_max_percent=101 のどれでも ConfigError になる
  - '未知のキー(例: [thresholds] perod_days)で ConfigError になる'
  - load_config(Path('aws-cost-cleaner.example.toml')) は load_config(None) と等しい
  depends_on:
  - T-002
  size: M
  human_check: ec2_network_bytes_max の標準値 -1(判定に使わない)でよいかを、開発者が決める。
  status: todo
- id: T-008
  title: 'Stage 0: 公式ドキュメントでの確認を記録する(調べ物)'
  milestone: M1
  request: '詳細設計「検証の方針」の Stage 0 の表 #1〜#14 を、AWS の公式ドキュメントで確かめて docs/verification-notes.md
    に記録する。コードとテストは書かない・変えない。#7 は、コンソールでグループ化の条件をいくつ選べるかと、EBS・NAT・EIP がどのサービス名に入るかだけを調べる(CSV
    の列の形式は T-010 で扱う)。確かめられなかった点は、結論に「未確認」と書く。#11 で条件キーに対応していないアクションが見つかったら、結論にそのアクション名を書く(設計や実装は変えない)。'
  acceptance:
  - docs/verification-notes.md に見出し「## 公式ドキュメントでの確認」がある
  - 'その見出しの下の表の列は、順に #、確かめること、結論、URL、確認日 である'
  - '表には # が 1〜14 の行が 1 行ずつ、ちょうど 14 行ある'
  - どの行も結論の欄が空でない
  - URL の欄は https:// で始まるか、未確認の行では - である。確認日は YYYY-MM-DD の形である
  depends_on: []
  size: M
  human_check: '開発者が結論を読み、特に #1(Resource Explorer の料金)、#5(Price List API)、#11(条件キー)の結果によって設計の見直しが要るかを決める。'
  status: todo
- id: T-009
  title: 'Stage 0: moto の対応状況を確かめて記録する(調べ物)'
  milestone: M1
  request: '詳細設計「ライブラリの確認」にもとづき、uv.lock の moto の版で次を実際に試し、docs/verification-notes.md
    に記録する。対象: resource-explorer-2 の Search、pricing の GetProducts、rds の stop_db_instance、elbv2
    の describe_target_health、cloudwatch の get_metric_statistics、ELBv2 の Type=gateway
    のロードバランサの作成。また、ID を指定した DescribeVolumes、DescribeAddresses、DescribeNatGateways、DescribeLoadBalancers、DescribeInstances、DescribeDBInstances
    で、存在しない ID を渡したときに moto が返すエラーコード。試したスクリプトはリポジトリに入れない。src/ と tests/ は変えない。'
  acceptance:
  - docs/verification-notes.md に見出し「## ライブラリの確認」がある
  - その見出しの下の表の列は、順に 対象、moto の版、結果、テストでの扱い である
  - 結果の欄は 対応、未対応、一部対応 のどれかで始まり、テストでの扱いの欄は moto か Stubber である
  - 存在しない ID の行が 6 つあり、それぞれ結果の欄に moto が返したエラーコード(または「エラーにならない」)が書いてある
  - src/ と tests/ に変更がない
  depends_on:
  - T-001
  - T-008
  size: S
  human_check: ''
  status: todo
- id: T-010
  title: Cost Explorer の CSV の見本を置き、形式を記録する
  milestone: M1
  request: '詳細設計 データ 8 と Stage 0 #7 のために、開発者が Cost Explorer のコンソールから出力した CSV(サービス別とリージョン別の
    2 つ。金額は書き換えてよい)を tests/fixtures/cost_by_service.csv と tests/fixtures/cost_by_region.csv
    として置く。受け取ったファイルをそのまま置き、自分で中身を作らない。docs/verification-notes.md に見出し「## Cost Explorer
    CSV の形式」を足し、表で、ヘッダー行、期間の列、合計の列の名前、合計の行の 1 列目の値、空のセルの有無、EBS・NAT・EIP・EC2・RDS・ELB
    の金額が入る列名を書く。コードは書かない。'
  acceptance:
  - tests/fixtures/cost_by_service.csv と tests/fixtures/cost_by_region.csv がある
  - どちらも Python の csv モジュールで encoding='utf-8-sig' で読め、ヘッダー行と 1 行以上のデータの行がある
  - docs/verification-notes.md に見出し「## Cost Explorer CSV の形式」がある
  - その下の表の列は、順に 項目、見本での値 である
  - 表に、ヘッダー行、期間の列、合計の列、合計の行、空のセル、EBS、NAT、EIP、EC2、RDS、ELB の 11 行がある
  depends_on:
  - T-009
  size: S
  human_check: 置いた CSV が実際にコンソールから出力したものであることを、開発者が確かめる。CSV は開発者が用意する。
  status: todo
- id: T-011
  title: API の許可リストとクライアントの生成(aws/guard.py、aws/session.py)
  milestone: M2
  request: '詳細設計 F-3 にもとづき、src/aws_cost_cleaner/aws/__init__.py、guard.py、session.py
    を作る。Mode = Literal[''read'',''tag'',''execute'']。guard.py: ALLOWED_OPERATIONS:
    Mapping[Mode, frozenset[str]](要素は ''<boto3 のサービス名>:<操作名>''。例 ''ec2:DescribeVolumes''、''elbv2:AddTags''。F-3
    の表のとおりで、read には pricing:GetProducts を含める)。ALLOWED_TAG_KEYS: tag は {CleanupCandidate,
    CleanupReason}、execute は {CleanupStoppedAt}。install_guard(client, mode) は client.meta.events
    の before-call.*.* にフックを登録し、許可にない操作で DisallowedApiCallError を出す。ec2:CreateTags、rds:AddTagsToResource、elbv2:AddTags
    では Tags のキーも確かめ、許可外なら DisallowedApiCallError。session.py: class ClientFactory(mode:
    Mode, profile: str | None = None)。メソッド client(service: str, region: str) は boto3.Session(profile_name=profile)
    からクライアントを作り、必ず install_guard してから返す。同じ (service, region) は使い回す。'
  acceptance:
  - read の ClientFactory で ec2:RunInstances、cloudwatch:GetMetricData、ce:GetCostAndUsage、s3:ListObjectsV2
    を呼ぶと DisallowedApiCallError になる(moto 環境で、AWS に届く前に止まる)
  - tag モードで CreateTags に Keep または CleanupStoppedAt のキーを渡すと DisallowedApiCallError、CleanupCandidate
    と CleanupReason だけなら通る
  - tag モードで ec2:TerminateInstances を呼ぶと DisallowedApiCallError になる
  - execute モードで CreateTags に CleanupCandidate を渡すと DisallowedApiCallError、CleanupStoppedAt
    だけなら通る
  - ALLOWED_OPERATIONS の tag と execute に resource-explorer-2:Search、cloudwatch:GetMetricStatistics、pricing:GetProducts
    が含まれない
  - ClientFactory('read').client('ec2', 'ap-northeast-1') を 2 回呼ぶと同じオブジェクトが返る
  depends_on:
  - T-002
  - T-005
  size: M
  human_check: ''
  status: todo
- id: T-012
  title: '判定ルール: 候補でないリソース(rules.py)'
  milestone: M2
  request: '詳細設計 F-7 の「候補でないリソース」とデータ 4 にもとづき、src/aws_cost_cleaner/rules.py を作る(boto3
    に依存しない)。has_elapsed(now: datetime, since: datetime, days: int) -> bool は now -
    since >= timedelta(days=days)。evaluate(resource: Resource, metrics: Mapping[str,
    float | None], thresholds: Thresholds, now: datetime) -> Finding | Skipped。このタスクでは
    CleanupCandidate のないリソースだけを扱う(候補済みは T-013)。metrics のキー: EC2 は cpu_max_percent、network_bytes_total、RDS
    は db_connections_max、rds_cpu_max_percent、NAT は nat_bytes_total。判定の順は、期間に満たない →
    too_new、判定に要る値が None → no_metrics、条件を満たさない → active。ELB は attrs[''registered_target_count'']、EIP
